name: module

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        if: hashFiles('gate.toml') != ''
        with:
          toolchain: "1.99.1"
          targets: wasm32-unknown-unknown
      - name: Cache wasm-tools
        id: wasm-tools
        if: hashFiles('gate.toml') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-tools
          key: wasm-tools-1.262.0
      - name: Install wasm-tools
        if: hashFiles('gate.toml') != '' && steps.wasm-tools.outputs.cache-hit != 'true'
        run: cargo install wasm-tools --version 1.262.0 --locked
      - name: Read gate.toml
        id: gate
        if: hashFiles('gate.toml') != ''
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("gate.toml", "rb") as f:
              g = tomllib.load(f)
          crate, subsystem = g["crate"], g["subsystem"]
          assert isinstance(crate, str) and isinstance(subsystem, str)
          assert not crate.startswith("/") and ".." not in crate.split("/")
          assert subsystem.isidentifier()
          print(f"crate={crate}")
          print(f"subsystem={subsystem}")
          PY
      - name: Build the module
        if: hashFiles('gate.toml') != ''
        env:
          CRATE: ${{ steps.gate.outputs.crate }}
          SUBSYSTEM: ${{ steps.gate.outputs.subsystem }}
        run: |
          set -eu
          case "$SUBSYSTEM" in
            wind_meteors) D=196608; T=48 ;;
            *) echo "no fixed base known for $SUBSYSTEM" >&2; exit 1 ;;
          esac
          cd "$CRATE"
          cargo rustc --release --locked --target wasm32-unknown-unknown --lib -- \
            -C link-arg=--import-memory -C link-arg=--import-table \
            -C link-arg=--global-base=$D -C link-arg=--table-base=$T \
            -C link-arg=--no-stack-first -C link-arg=--no-entry \
            -C link-arg=-zstack-size=4096 -C link-arg=--gc-sections
          mkdir -p "$GITHUB_WORKSPACE/out"
          set -- target/wasm32-unknown-unknown/release/*.wasm
          [ "$#" -eq 1 ] || { echo "expected exactly one .wasm" >&2; exit 1; }
          python3 "$GITHUB_WORKSPACE/tools/meter.py" "$1" "$GITHUB_WORKSPACE/out/module.wasm"
          printf '%s\n' "$SUBSYSTEM" > "$GITHUB_WORKSPACE/out/subsystem"
      - uses: actions/upload-artifact@v4
        if: hashFiles('gate.toml') != ''
        with:
          name: module
          path: |
            out/module.wasm
            out/subsystem
          if-no-files-found: error
