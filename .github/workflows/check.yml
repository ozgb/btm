name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-11-04
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Find the workspace members
        id: ws
        run: |
          set -eu
          cargo metadata --no-deps --format-version 1 > metadata.json
          n=$(python3 -c 'import json; print(len(json.load(open("metadata.json"))["workspace_members"]))')
          rm metadata.json
          echo "members=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::notice::The workspace has no members yet, so the checks are skipped."
          fi
      - name: Format
        if: steps.ws.outputs.members != '0'
        run: cargo fmt --all --check
      - name: Clippy
        if: steps.ws.outputs.members != '0'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        if: steps.ws.outputs.members != '0'
        run: cargo test --locked --workspace
      - name: Cache cargo-deny
        id: cargo-deny
        if: steps.ws.outputs.members != '0'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.22.1
      - name: Install cargo-deny
        if: steps.ws.outputs.members != '0' && steps.cargo-deny.outputs.cache-hit != 'true'
        run: cargo install cargo-deny --version 0.22.1 --locked
      - name: Check licences
        if: steps.ws.outputs.members != '0'
        run: cargo deny --workspace --locked check licenses
