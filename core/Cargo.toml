[package]
name = "engine-core"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmi = { version = "=2.0.3", default-features = false, features = ["std", "validate", "stable"] }
serde_json = "1"
wasm-encoder = { version = "0.228", features = ["wasmparser"] }
wasmparser = "0.228"

[profile.release]
opt-level = 3
panic = "unwind"

[[bin]]
name = "core"
path = "src/main.rs"
